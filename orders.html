<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History & Reorder | WINSTAR DIGITAL PRINTING & XEROX</title>
    <meta name="description" content="View past wholesale printing orders and duplicate orders in 1-click with Winstar Digital Printing Dindigul.">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>

<div class="texture-overlay"></div>

<!-- HEADER NAVBAR -->
<header class="navbar">
    <div class="container navbar-container">
        <a href="index.html" class="logo-brand">
            <div class="logo-badge">
                <img src="assets/images/logo.png" alt="Winstar Digital Printing Logo">
            </div>
            <div class="logo-text">
                <div class="logo-title">WINSTAR <span>DIGITAL</span></div>
                <div class="logo-sub">PRINTING & XEROX</div>
            </div>
        </a>

        <ul class="nav-menu">
            <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
            <li><a href="wholesale-order.html" class="nav-link">New Wholesale Order</a></li>
            <li><a href="orders.html" class="nav-link active">Order History</a></li>
            <li class="mobile-menu-actions">
                <a href="wholesale-order.html" class="btn btn-gradient btn-sm" style="width: 100%; justify-content: center; margin-bottom: 8px;">+ New Order</a>
                <button type="button" class="btn btn-outline btn-sm" id="btn-logout-mobile" style="border-color: var(--color-error); color: var(--color-error); width: 100%; display: flex; justify-content: center; align-items: center; gap: 6px;">
                    <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                    </svg>
                    Logout
                </button>
            </li>
        </ul>

        <div class="nav-actions">
            <a href="cart.html" class="cart-btn" title="Wholesale Cart">
                <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
                </svg>
                <span class="cart-badge" style="display: none;">0</span>
            </a>
            <a href="wholesale-order.html" class="btn btn-gradient btn-sm">+ New Order</a>

            <button class="mobile-toggle" aria-label="Toggle Navigation Menu">
                <span></span><span></span><span></span>
            </button>
        </div>
    </div>
</header>

<!-- PAGE HERO -->
<section style="padding: calc(var(--nav-height) + 40px) 0 40px; background: var(--gradient-dark-plum); border-bottom: 1px solid var(--color-border-dark);">
    <div class="container">
        <div class="badge badge-wholesale" style="margin-bottom: 8px;">REPEAT ORDERING ARCHITECTURE</div>
        <h1 style="font-size: var(--text-3xl);">ORDER HISTORY & <span class="gradient-text-yellow">REORDER</span></h1>
    </div>
</section>

<!-- ORDERS LISTING CONTAINER -->
<section class="section-padding" style="background: var(--color-bg-surface);">
    <div class="container">
        <div id="orders-history-container" style="display: flex; flex-direction: column; gap: 24px;">
        </div>
    </div>
</section>

<!-- FOOTER -->
<footer class="footer">
    <div class="container">
        <div class="footer-bottom" style="border: none;">
            <div>&copy; 2026 WINSTAR DIGITAL PRINTING & XEROX. Order History.</div>
        </div>
    </div>
</footer>

<script type="module">
    import { Orders } from './js/orders.js';
    import { Auth } from './js/auth.js';
    import { showToast } from './js/app.js';

    document.addEventListener('DOMContentLoaded', () => {
        function renderOrders() {
            const userOrders = Orders.getUserOrders();
            const container = document.getElementById('orders-history-container');
            container.innerHTML = '';

            if (userOrders.length === 0) {
                container.innerHTML = `
                    <div class="glass-card" style="padding: 50px; text-align: center; color: var(--color-text-muted);">
                        No wholesale orders found in your history.<br><br>
                        <a href="wholesale-order.html" class="btn btn-gradient">Create Your First Order &rarr;</a>
                    </div>
                `;
                return;
            }

            userOrders.forEach(order => {
                const card = document.createElement('div');
                card.className = 'glass-card gradient-border-card';
                card.style.padding = '30px';

                let itemsHtml = order.items.map(item => `
                    <div style="font-size: 0.9rem; color: #FFF; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05);">
                        <strong>${item.fileName}</strong> &bull; ${item.config.copies} Copies (${item.config.paperSize}) &bull; ₹${item.pricing.total}
                    </div>
                `).join('');

                card.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 16px;">
                        <div>
                            <span class="badge badge-wholesale" style="margin-right: 10px;">${order.orderStatus}</span>
                            <strong style="font-size: 1.2rem; color: #FFF;">ORDER #${order.id}</strong>
                            <span style="font-size: 0.85rem; color: var(--color-text-muted); margin-left: 10px;">${new Date(order.createdAt).toLocaleDateString()}</span>
                        </div>
                        <div style="font-size: 1.5rem; font-weight: 800; color: var(--winstar-yellow);">₹${order.total}</div>
                    </div>

                    <div style="margin-bottom: 20px; background: rgba(0,0,0,0.2); padding: 16px; border-radius: var(--radius-md);">
                        ${itemsHtml}
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
                        <div style="font-size: 0.85rem; color: var(--color-text-muted);">
                            Payment Status: <strong style="color: var(--color-success);">PAID</strong> &bull; Delivery: ${order.deliveryDetails ? order.deliveryDetails.method : 'Standard'}
                        </div>
                        <div style="display: flex; gap: 12px;">
                            <a href="order-success.html?id=${order.id}" class="btn btn-outline btn-sm">Track Progress</a>
                            <button type="button" class="btn btn-yellow btn-sm btn-reorder-action" data-id="${order.id}">
                                REORDER IN 1-CLICK &rarr;
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            container.querySelectorAll('.btn-reorder-action').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.getAttribute('data-id');
                    const res = Orders.reorder(id);
                    if (res.success) {
                        showToast(`Duplicated ${res.itemsCount} item(s) to Cart! Redirecting...`, "success");
                        setTimeout(() => {
                            window.location.href = 'cart.html';
                        }, 600);
                    }
                });
            });
        }

        renderOrders();
    });
</script>

<script type="module" src="js/app.js"></script>
</body>
</html>
