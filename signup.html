<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Business Account | WINSTAR DIGITAL PRINTING & XEROX</title>
    <meta name="description" content="Register your company or agency for Winstar Business Wholesale Portal for discounted printing rates and express delivery.">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body style="background: var(--gradient-dark-plum); min-height: 100vh;">

<div class="texture-overlay"></div>

<!-- HEADER NAVBAR -->
<header class="navbar">
    <div class="container navbar-container">
        <a href="index.html" class="logo-brand">
            <div class="logo-badge">
                <img src="assets/images/logo.png" alt="Winstar Digital Printing Logo">
            </div>
            <div class="logo-text">
                <div class="logo-title">WINSTAR <span>DIGITAL</span></div>
                <div class="logo-sub">PRINTING & XEROX</div>
            </div>
        </a>
        <div class="nav-actions">
            <a href="login.html" class="btn btn-outline btn-sm">Already Registered? Sign In</a>
        </div>
    </div>
</header>

<!-- REGISTRATION FORM CONTAINER -->
<main class="container" style="padding: 120px 20px 80px;">
    <div class="glass-card gradient-border-card" style="max-width: 780px; margin: 0 auto; padding: 40px;">
        
        <div class="text-center" style="margin-bottom: 32px;">
            <div class="badge badge-wholesale" style="margin-bottom: 12px;">WHOLESALE REGISTRATION</div>
            <h1 style="font-size: 2.25rem; color: #FFF; margin-bottom: 8px;">CREATE BUSINESS ACCOUNT</h1>
            <p style="font-size: 0.95rem;">Unlock wholesale printing rates, bulk quantity ordering & address saving.</p>
        </div>

        <form id="signup-form">
            <!-- SECTION 1: PERSONAL & COMPANY INFO -->
            <div style="font-weight: 700; font-size: 1.1rem; color: var(--winstar-yellow); margin-bottom: 16px; border-bottom: 1px solid var(--color-border-dark); padding-bottom: 8px;">
                1. PERSONAL & COMPANY INFORMATION
            </div>

            <div class="grid-2" style="gap: 20px; margin-bottom: 20px;">
                <div>
                    <label style="display: block; font-size: 0.85rem; font-weight: 700; color: #FFF; margin-bottom: 6px;">FULL NAME *</label>
                    <input type="text" id="signup-name" required class="glass-card" style="width: 100%; padding: 12px 16px; color: #FFF;" placeholder="John Doe">
                </div>
                <div>
                    <label style="display: block; font-size: 0.85rem; font-weight: 700; color: #FFF; margin-bottom: 6px;">COMPANY / AGENCY NAME *</label>
                    <input type="text" id="signup-company" required class="glass-card" style="width: 100%; padding: 12px 16px; color: #FFF;" placeholder="Acme Creative Agency">
                </div>
            </div>

            <div class="grid-2" style="gap: 20px; margin-bottom: 20px;">
                <div>
                    <label style="display: block; font-size: 0.85rem; font-weight: 700; color: #FFF; margin-bottom: 6px;">GST NUMBER (OPTIONAL)</label>
                    <input type="text" id="signup-gst" class="glass-card" style="width: 100%; padding: 12px 16px; color: #FFF;" placeholder="33AAAAA0000A1Z5">
                </div>
                <div>
                    <label style="display: block; font-size: 0.85rem; font-weight: 700; color: #FFF; margin-bottom: 6px;">MOBILE NUMBER *</label>
                    <input type="tel" id="signup-phone" required class="glass-card" style="width: 100%; padding: 12px 16px; color: #FFF;" placeholder="9876543210">
                </div>
            </div>

            <div class="grid-2" style="gap: 20px; margin-bottom: 20px;">
                <div>
                    <label style="display: block; font-size: 0.85rem; font-weight: 700; color: #FFF; margin-bottom: 6px;">EMAIL ADDRESS *</label>
                    <input type="email" id="signup-email" required class="glass-card" style="width: 100%; padding: 12px 16px; color: #FFF;" placeholder="john@acme.com">
                </div>
                <div>
                    <label style="display: block; font-size: 0.85rem; font-weight: 700; color: #FFF; margin-bottom: 6px;">PASSWORD *</label>
                    <input type="password" id="signup-password" required class="glass-card" style="width: 100%; padding: 12px 16px; color: #FFF;" placeholder="••••••••">
                </div>
            </div>

            <!-- SECTION 2: BUSINESS ADDRESS -->
            <div style="font-weight: 700; font-size: 1.1rem; color: var(--winstar-yellow); margin-top: 30px; margin-bottom: 16px; border-bottom: 1px solid var(--color-border-dark); padding-bottom: 8px;">
                2. BUSINESS DELIVERY ADDRESS
            </div>

            <div style="margin-bottom: 16px;">
                <label style="display: block; font-size: 0.85rem; font-weight: 700; color: #FFF; margin-bottom: 6px;">ADDRESS LINE 1 *</label>
                <input type="text" id="signup-addr1" required class="glass-card" style="width: 100%; padding: 12px 16px; color: #FFF;" placeholder="Door No, Street Name, Industrial Area">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 0.85rem; font-weight: 700; color: #FFF; margin-bottom: 6px;">ADDRESS LINE 2</label>
                <input type="text" id="signup-addr2" class="glass-card" style="width: 100%; padding: 12px 16px; color: #FFF;" placeholder="Landmark / Suite Number">
            </div>

            <div class="grid-3" style="gap: 16px; margin-bottom: 30px;">
                <div>
                    <label style="display: block; font-size: 0.85rem; font-weight: 700; color: #FFF; margin-bottom: 6px;">CITY / DISTRICT *</label>
                    <input type="text" id="signup-city" required class="glass-card" style="width: 100%; padding: 12px 16px; color: #FFF;" value="Dindigul">
                </div>
                <div>
                    <label style="display: block; font-size: 0.85rem; font-weight: 700; color: #FFF; margin-bottom: 6px;">STATE *</label>
                    <input type="text" id="signup-state" required class="glass-card" style="width: 100%; padding: 12px 16px; color: #FFF;" value="Tamil Nadu">
                </div>
                <div>
                    <label style="display: block; font-size: 0.85rem; font-weight: 700; color: #FFF; margin-bottom: 6px;">POSTAL PINCODE *</label>
                    <input type="text" id="signup-pincode" required class="glass-card" style="width: 100%; padding: 12px 16px; color: #FFF;" placeholder="624001">
                </div>
            </div>

            <button type="submit" class="btn btn-gradient btn-lg" style="width: 100%;">
                CREATE BUSINESS ACCOUNT &rarr;
            </button>
        </form>

    </div>
</main>

<script type="module">
    import { Auth } from './js/auth.js';
    import { showToast } from './js/app.js';

    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('signup-form');
        const submitBtn = form.querySelector('button[type="submit"]');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'SUBMITTING REGISTRATION...';

            const userData = {
                name: document.getElementById('signup-name').value,
                companyName: document.getElementById('signup-company').value,
                gstNumber: document.getElementById('signup-gst').value,
                phone: document.getElementById('signup-phone').value,
                email: document.getElementById('signup-email').value,
                password: document.getElementById('signup-password').value,
                address: {
                    line1: document.getElementById('signup-addr1').value,
                    line2: document.getElementById('signup-addr2').value,
                    city: document.getElementById('signup-city').value,
                    state: document.getElementById('signup-state').value,
                    pincode: document.getElementById('signup-pincode').value
                }
            };

            const res = await Auth.signup(userData);
            if (res.success) {
                showToast("Registration submitted! Account awaiting admin approval.", "success");
                
                // Show explicit modal notice
                alert("Your registration has been submitted successfully.\n\nYour account is currently awaiting approval from the administrator.\n\nYou will be notified via email once approved.");
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1200);
            } else {
                showToast(res.message, "error");
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'CREATE BUSINESS ACCOUNT &rarr;';
            }
        });
    });
</script>

<script type="module" src="js/app.js"></script>
</body>
</html>
