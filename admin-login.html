<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Sign In | WINSTAR DIGITAL PRINTING & XEROX</title>
    <meta name="description" content="Administrator portal login for Winstar Digital Printing & Xerox management.">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body style="background: var(--gradient-dark-plum); min-height: 100vh; display: flex; flex-direction: column;">

<div class="texture-overlay"></div>

<!-- HEADER NAVBAR -->
<header class="navbar">
    <div class="container navbar-container">
        <a href="index.html" class="logo-brand">
            <div class="logo-badge">
                <img src="assets/images/logo.png" alt="Winstar Digital Printing Logo">
            </div>
            <div class="logo-text">
                <div class="logo-title">WINSTAR <span>DIGITAL</span></div>
                <div class="logo-sub">ADMINISTRATION PORTAL</div>
            </div>
        </a>
        <div class="nav-actions">
            <a href="login.html" class="btn btn-outline btn-sm">Customer Sign In</a>

            <button class="mobile-toggle" aria-label="Toggle Navigation Menu">
                <span></span><span></span><span></span>
            </button>
        </div>
    </div>
</header>

<!-- LOGIN CENTERED BOX -->
<main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 120px 20px 60px;">
    <div class="glass-card gradient-border-card" style="width: 100%; max-width: 440px; padding: 40px; border-top: 4px solid var(--winstar-pink);">
        <div class="text-center" style="margin-bottom: 28px;">
            <div class="badge" style="background: rgba(224, 30, 90, 0.2); color: var(--winstar-pink); margin-bottom: 12px;">ADMINISTRATOR ACCESS ONLY</div>
            <h1 style="font-size: 2rem; color: #FFF; margin-bottom: 6px;">STAFF PORTAL</h1>
            <p style="font-size: 0.9rem;">Sign in with administrator credentials to manage user approvals & orders.</p>
        </div>

        <form id="admin-login-form">
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 0.85rem; font-weight: 700; color: #FFF; margin-bottom: 8px;">ADMIN EMAIL ADDRESS *</label>
                <input type="email" id="admin-email" required class="glass-card" style="width: 100%; padding: 12px 16px; color: #FFF;" placeholder="">
            </div>

            <div style="margin-bottom: 24px;">
                <label style="display: block; font-size: 0.85rem; font-weight: 700; color: #FFF; margin-bottom: 8px;">PASSWORD *</label>
                <input type="password" id="admin-password" required class="glass-card" style="width: 100%; padding: 12px 16px; color: #FFF;" placeholder="">
            </div>

            <button type="submit" class="btn btn-gradient btn-lg" style="width: 100%; margin-bottom: 20px; background: var(--gradient-red-pink);">
                ADMIN SIGN IN &rarr;
            </button>
        </form>

        <div style="padding: 12px; background: rgba(255, 255, 255, 0.05); border: 1px dashed rgba(255, 255, 255, 0.15); border-radius: var(--radius-md); font-size: 0.8rem; color: var(--color-text-muted); text-align: center;">
            <strong>SECURITY NOTICE:</strong><br>
            All admin operations and approvals are logged server-side.
        </div>
    </div>
</main>

<script type="module">
    import { Auth } from './js/auth.js';
    import { showToast } from './js/app.js';

    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('admin-login-form');
        const submitBtn = form.querySelector('button[type="submit"]');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'VERIFYING ADMIN...';

            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;

            const res = await Auth.login(email, password);
            if (res.success) {
                if (res.user && res.user.role === 'admin') {
                    showToast("Admin verification successful! Redirecting...", "success");
                    setTimeout(() => {
                        window.location.href = 'admin.html';
                    }, 800);
                } else {
                    showToast("Access Denied. You do not have administrator permissions.", "error");
                    Auth.logout();
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'ADMIN SIGN IN &rarr;';
                }
            } else {
                showToast(res.message || "Invalid admin credentials.", "error");
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'ADMIN SIGN IN &rarr;';
            }
        });
    });
</script>

<script type="module" src="js/app.js"></script>
</body>
</html>
